name: Build and Publish Release Bundle

# Builds the canonical GitHub release bundle (`owl-semaphore-<TAG>.zip`) on
# tag push.
#
# The list of files that must appear in the bundle is defined by
# `RELEASE-BUNDLE-MANIFEST.txt` at the repo root. That file is the single
# source of truth — the steps below read it and assemble the bundle from
# it. To add a new canonical release artifact, edit the manifest, not this
# workflow. `tests/test_release_bundle.py` enforces in CI that every path
# listed in the manifest exists at the tagged commit.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6

      - name: Get tag name
        run: echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Validate required files (from RELEASE-BUNDLE-MANIFEST.txt)
        run: |
          set -euo pipefail
          test -f RELEASE-BUNDLE-MANIFEST.txt
          missing=0
          while IFS= read -r raw; do
            entry="${raw%%#*}"
            entry="$(echo "$entry" | sed -e 's/[[:space:]]*$//' -e 's/^[[:space:]]*//')"
            [ -z "$entry" ] && continue
            if [[ "$entry" == */ ]]; then
              if [ ! -d "${entry%/}" ]; then
                echo "::error::missing directory required by RELEASE-BUNDLE-MANIFEST.txt: $entry"
                missing=1
              fi
            else
              if [ ! -f "$entry" ]; then
                echo "::error::missing file required by RELEASE-BUNDLE-MANIFEST.txt: $entry"
                missing=1
              fi
            fi
          done < RELEASE-BUNDLE-MANIFEST.txt
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build bundle
        run: |
          set -euo pipefail

          BUNDLE="owl-semaphore-${TAG}"
          mkdir "${BUNDLE}"

          while IFS= read -r raw; do
            entry="${raw%%#*}"
            entry="$(echo "$entry" | sed -e 's/[[:space:]]*$//' -e 's/^[[:space:]]*//')"
            [ -z "$entry" ] && continue
            if [[ "$entry" == */ ]]; then
              cp -R "${entry%/}" "${BUNDLE}/"
            else
              # Preserve parent directory structure for nested files.
              parent="$(dirname "$entry")"
              if [ "$parent" != "." ]; then
                mkdir -p "${BUNDLE}/${parent}"
              fi
              cp "$entry" "${BUNDLE}/${entry}"
            fi
          done < RELEASE-BUNDLE-MANIFEST.txt

          # Ship the manifest itself inside the bundle so downstream
          # consumers can reproduce the expected file list.
          cp RELEASE-BUNDLE-MANIFEST.txt "${BUNDLE}/"

          zip -r "${BUNDLE}.zip" "${BUNDLE}"

      - name: Verify bundle contents match manifest
        run: |
          set -euo pipefail
          BUNDLE="owl-semaphore-${TAG}"
          fail=0
          while IFS= read -r raw; do
            entry="${raw%%#*}"
            entry="$(echo "$entry" | sed -e 's/[[:space:]]*$//' -e 's/^[[:space:]]*//')"
            [ -z "$entry" ] && continue
            if [[ "$entry" == */ ]]; then
              if [ ! -d "${BUNDLE}/${entry%/}" ]; then
                echo "::error::bundle missing directory: $entry"
                fail=1
              fi
            else
              if [ ! -f "${BUNDLE}/${entry}" ]; then
                echo "::error::bundle missing file: $entry"
                fail=1
              fi
            fi
          done < RELEASE-BUNDLE-MANIFEST.txt
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Create GitHub Release + upload bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Owl Semaphore ${{ env.TAG }} — Full Source & Release Bundle
          files: owl-semaphore-${{ env.TAG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
